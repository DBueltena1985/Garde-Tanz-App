{% extends "admin/change_list.html" %}

{% block search %}
{{ block.super }}
<form method="get" style="margin: 0.6rem 0;">
    {% for key, value in request.GET.items %}
        {% if key != 'kann_unterstuetzen_bei' %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}
    {% endfor %}
    <label for="kann-unterstuetzen-top" style="font-weight:600; margin-right:0.4rem;">Kann unterstützen bei:</label>
    <select name="kann_unterstuetzen_bei" id="kann-unterstuetzen-top" onchange="this.form.submit()">
        <option value="">Alle</option>
        <option value="hilfe_fahrdienste" {% if request.GET.kann_unterstuetzen_bei == "hilfe_fahrdienste" %}selected{% endif %}>Fahrdiensten</option>
        <option value="hilfe_veranstaltungen" {% if request.GET.kann_unterstuetzen_bei == "hilfe_veranstaltungen" %}selected{% endif %}>Veranstaltungen</option>
        <option value="hilfe_kuchen_essensspenden" {% if request.GET.kann_unterstuetzen_bei == "hilfe_kuchen_essensspenden" %}selected{% endif %}>Kuchen / Essensspenden</option>
        <option value="hilfe_dekoration_basteln" {% if request.GET.kann_unterstuetzen_bei == "hilfe_dekoration_basteln" %}selected{% endif %}>Dekoration / Basteln</option>
        <option value="hilfe_naehen_aenderungen" {% if request.GET.kann_unterstuetzen_bei == "hilfe_naehen_aenderungen" %}selected{% endif %}>Nähen / Änderungen an Kostümen</option>
        <option value="hilfe_fotos_social_media" {% if request.GET.kann_unterstuetzen_bei == "hilfe_fotos_social_media" %}selected{% endif %}>Fotos / Social Media</option>
        <option value="hilfe_organisation" {% if request.GET.kann_unterstuetzen_bei == "hilfe_organisation" %}selected{% endif %}>Organisation</option>
        <option value="hilfe_sponsoring_kontakte" {% if request.GET.kann_unterstuetzen_bei == "hilfe_sponsoring_kontakte" %}selected{% endif %}>Sponsoring / Kontakte</option>
        <option value="hilfe_sonstiges" {% if request.GET.kann_unterstuetzen_bei == "hilfe_sonstiges" %}selected{% endif %}>Sonstiges</option>
    </select>
</form>
{% endblock %}

{% block result_list %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var table = document.getElementById('result_list');
    if (!table) { return; }
    var tbody = table.querySelector('tbody');
    if (!tbody) { return; }

    var filterAktiv = {% if request.GET.kann_unterstuetzen_bei %}true{% else %}false{% endif %};

    var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    var gruppen = {trainer: [], orga: [], mitglied: []};

    rows.forEach(function (row) {
        var trainerBild = row.querySelector('td.field-trainer_team img');
        var orgaBild = row.querySelector('td.field-orga_team img');
        var istTrainer = trainerBild && trainerBild.alt === 'True';
        var istOrga = orgaBild && orgaBild.alt === 'True';
        if (istTrainer) {
            gruppen.trainer.push(row);
        } else if (istOrga) {
            gruppen.orga.push(row);
        } else {
            gruppen.mitglied.push(row);
        }
    });

    // Nur gruppieren, wenn ueberhaupt die erwarteten Spalten vorhanden sind
    // (sonst z.B. bei aktivem Spalten-Filter nichts kaputt machen).
    if (!rows.length || !rows[0].querySelector('td.field-trainer_team')) { return; }

    var anzahlSpalten = table.querySelectorAll('thead th').length;
    var reihenfolge = [
        {schluessel: 'trainer', label: 'Trainer'},
        {schluessel: 'orga', label: 'Orga-Team'},
        {schluessel: 'mitglied', label: 'Mitglieder'},
    ];

    reihenfolge.forEach(function (gruppe) {
        var zeilen = gruppen[gruppe.schluessel];
        if (!zeilen.length) { return; }

        var kopfzeile = document.createElement('tr');
        kopfzeile.style.cursor = 'pointer';
        kopfzeile.style.background = 'var(--darkened-bg, #eee)';
        var zelle = document.createElement('td');
        zelle.colSpan = anzahlSpalten;
        zelle.style.fontWeight = '700';
        zelle.style.padding = '6px 10px';
        zelle.textContent = (filterAktiv ? '▾ ' : '▸ ') + gruppe.label + ' (' + zeilen.length + ')';
        kopfzeile.appendChild(zelle);
        tbody.appendChild(kopfzeile);

        zeilen.forEach(function (zeile) {
            zeile.style.display = filterAktiv ? '' : 'none';
            tbody.appendChild(zeile);
        });

        kopfzeile.addEventListener('click', function () {
            var eingeklappt = zeilen[0].style.display === 'none';
            zelle.textContent = (eingeklappt ? '▾ ' : '▸ ') + gruppe.label + ' (' + zeilen.length + ')';
            zeilen.forEach(function (zeile) {
                zeile.style.display = eingeklappt ? '' : 'none';
            });
        });
    });
});
</script>
{% endblock %}
