{% extends "admin/base.html" %}

{% block extrahead %}
{{ block.super }}
<script>
    // Navigations-Seitenleiste beim allerersten Besuch zugeklappt starten.
    // Sobald jemand sie manuell auf-/zuklappt, wird diese eigene Wahl (im Browser) respektiert.
    if (localStorage.getItem('django.admin.navSidebarIsOpen') === null) {
        localStorage.setItem('django.admin.navSidebarIsOpen', 'false');
    }
</script>
{% endblock %}
