{% extends "admin/base.html" %}

{% block extrahead %}
{{ block.super }}
<style>
    #changelist-filter.gt-filter-collapsed > *:not(#changelist-filter-header) { display: none; }
    #changelist-filter-header { cursor: pointer; }
    .datei-dropzone {
        border: 2px dashed transparent;
        border-radius: 6px;
        padding: 4px;
        transition: border-color 0.15s, background-color 0.15s;
    }
    .datei-dropzone-aktiv {
        border-color: #7a2159;
        background-color: rgba(122, 33, 89, 0.08);
    }

    /* Listen-Tabellen auf dem Handy als Karten statt als breite Tabelle mit vielen
       Spalten (siehe garde-tabellen-labels.js, das dafuer data-label-Attribute setzt). */
    @media (max-width: 767px) {
        #changelist-form table#result_list,
        #changelist-form table#result_list thead,
        #changelist-form table#result_list tbody,
        #changelist-form table#result_list tr,
        #changelist-form table#result_list th,
        #changelist-form table#result_list td {
            display: block;
        }
        #changelist-form table#result_list thead tr {
            position: absolute;
            left: -9999px;
        }
        #changelist-form table#result_list tbody tr {
            border: 1px solid var(--hairline-color);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 6px 10px;
            background: var(--darkened-bg);
        }
        #changelist-form table#result_list th,
        #changelist-form table#result_list td {
            border: none;
            padding: 4px 0 4px 42%;
            position: relative;
            min-height: 1.3em;
            text-align: left;
            white-space: normal;
            word-break: break-word;
        }
        #changelist-form table#result_list th[data-label]::before,
        #changelist-form table#result_list td[data-label]::before {
            content: attr(data-label);
            position: absolute;
            left: 0;
            top: 4px;
            width: 40%;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            color: var(--body-quiet-color);
        }
        #changelist-form table#result_list th.action-checkbox-column,
        #changelist-form table#result_list td.action-checkbox {
            padding-left: 0;
        }
        #changelist-form table#result_list th.action-checkbox-column::before,
        #changelist-form table#result_list td.action-checkbox::before {
            content: none;
        }
    }
</style>
<script>
    // Fuer die Handy-Kartenansicht (siehe <style> oben): jeder Zelle einer Listen-Tabelle
    // die Spaltenueberschrift als data-label mitgeben, damit sie auf schmalen Bildschirmen
    // als Beschriftung vor dem Wert erscheint.
    document.addEventListener('DOMContentLoaded', function () {
        var tabelle = document.getElementById('result_list');
        if (!tabelle) { return; }
        var kopfzellen = tabelle.querySelectorAll('thead th');
        var ueberschriften = Array.prototype.map.call(kopfzellen, function (th) {
            var link = th.querySelector('.text a') || th.querySelector('a');
            var text = link ? link.textContent : th.textContent;
            return text.replace(/\s+/g, ' ').trim();
        });
        tabelle.querySelectorAll('tbody tr').forEach(function (zeile) {
            var zellen = zeile.querySelectorAll('th, td');
            zellen.forEach(function (zelle, index) {
                if (ueberschriften[index]) {
                    zelle.setAttribute('data-label', ueberschriften[index]);
                }
            });
        });
    });

    // Der "FILTER"-Kasten in Listenansichten startet zugeklappt, Klick auf die
    // Überschrift klappt ihn auf/zu.
    document.addEventListener('DOMContentLoaded', function () {
        var filterBox = document.getElementById('changelist-filter');
        var heading = document.getElementById('changelist-filter-header');
        if (!filterBox || !heading) { return; }
        filterBox.classList.add('gt-filter-collapsed');
        heading.addEventListener('click', function () {
            filterBox.classList.toggle('gt-filter-collapsed');
        });
    });

    // Datei-/Bild-Upload-Felder per Drag-and-Drop bedienbar machen.
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('input[type="file"]').forEach(function (input) {
            var container = input.closest('.form-row') || input.parentElement;
            if (!container || container.dataset.dateiDropzoneInit) { return; }
            container.dataset.dateiDropzoneInit = 'true';
            container.classList.add('datei-dropzone');

            ['dragenter', 'dragover'].forEach(function (ereignis) {
                container.addEventListener(ereignis, function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    container.classList.add('datei-dropzone-aktiv');
                });
            });
            ['dragleave', 'drop'].forEach(function (ereignis) {
                container.addEventListener(ereignis, function (e) {
                    e.preventDefault();
                    e.stopPropagation();
                    container.classList.remove('datei-dropzone-aktiv');
                });
            });
            container.addEventListener('drop', function (e) {
                if (input.disabled || input.readOnly) { return; }
                if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    input.dispatchEvent(new Event('change', {bubbles: true}));
                }
            });
        });
    });

    // Beim Speichern/Loeschen (auch Sammel-Aktionen, Bestaetigungsseiten) Warte-Cursor
    // anzeigen, damit sichtbar ist, dass etwas passiert. Buttons werden bewusst NICHT
    // deaktiviert, da Django-Admin-Speicherbuttons (_save/_continue/_addanother) ueber
    // ihren name/value unterscheiden, welche Aktion gemeint ist - ein disabled Button
    // wird beim Absenden nicht mitgeschickt und wuerde das kaputt machen.
    document.addEventListener('submit', function (e) {
        var form = e.target;
        if (!(form instanceof HTMLFormElement)) { return; }
        document.documentElement.style.cursor = 'wait';
        form.querySelectorAll('button[type="submit"], input[type="submit"]').forEach(function (btn) {
            btn.style.cursor = 'wait';
            btn.style.opacity = '0.6';
        });
    }, true);
</script>
{% endblock %}
