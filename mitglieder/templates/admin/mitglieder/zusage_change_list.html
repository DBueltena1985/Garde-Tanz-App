{% extends "admin/change_list.html" %}

{% block result_list %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {
    var table = document.getElementById('result_list');
    if (!table) { return; }
    var tbody = table.querySelector('tbody');
    if (!tbody) { return; }

    var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
    if (!rows.length || !rows[0].querySelector('.field-termin_datum')) { return; }

    var gruppen = {};
    var reihenfolge = [];
    rows.forEach(function (row) {
        var tagSpan = row.querySelector('.field-termin_datum span[data-tag]');
        if (!tagSpan) { return; }
        var tag = tagSpan.getAttribute('data-tag');
        if (!gruppen[tag]) {
            gruppen[tag] = [];
            reihenfolge.push(tag);
        }
        gruppen[tag].push(row);
    });
    if (!reihenfolge.length) { return; }

    var anzahlSpalten = table.querySelectorAll('thead th').length;

    reihenfolge.forEach(function (tag) {
        var zeilen = gruppen[tag];
        var teile = tag.split('-');
        var label = teile.length === 3 ? (teile[2] + '.' + teile[1] + '.' + teile[0]) : tag;

        var kopfzeile = document.createElement('tr');
        kopfzeile.style.cursor = 'pointer';
        kopfzeile.style.background = 'var(--darkened-bg, #eee)';
        var zelle = document.createElement('td');
        zelle.colSpan = anzahlSpalten;
        zelle.style.fontWeight = '700';
        zelle.style.padding = '6px 10px';
        zelle.textContent = '▸ ' + label + ' (' + zeilen.length + ')';
        kopfzeile.appendChild(zelle);
        tbody.appendChild(kopfzeile);

        zeilen.forEach(function (zeile) {
            zeile.style.display = 'none';
            tbody.appendChild(zeile);
        });

        kopfzeile.addEventListener('click', function () {
            var eingeklappt = zeilen[0].style.display === 'none';
            zelle.textContent = (eingeklappt ? '▾ ' : '▸ ') + label + ' (' + zeilen.length + ')';
            zeilen.forEach(function (zeile) {
                zeile.style.display = eingeklappt ? '' : 'none';
            });
        });
    });
});
</script>
{% endblock %}
