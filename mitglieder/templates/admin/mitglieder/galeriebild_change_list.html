{% extends "admin/change_list.html" %}

{% block content %}
{{ block.super }}
<style>
.galerie-gruppe-header td {
    cursor: pointer;
    font-weight: bold;
    background: var(--darkened-bg);
}
.galerie-gruppe-header .galerie-gruppe-pfeil {
    display: inline-block;
    margin-right: 0.5rem;
    transition: transform 0.15s ease;
}
.galerie-gruppe-header.aufgeklappt .galerie-gruppe-pfeil {
    transform: rotate(90deg);
}
</style>
<script>
document.addEventListener('DOMContentLoaded', function () {
    var table = document.getElementById('result_list');
    if (!table || !table.tHead || !table.tBodies.length) { return; }

    var headerZellen = Array.prototype.slice.call(table.tHead.rows[0].cells);
    var ordnerIdx = -1;
    var veranstaltungIdx = -1;
    headerZellen.forEach(function (th, idx) {
        var textEl = th.querySelector('.text');
        var text = (textEl ? textEl.textContent : th.textContent).trim().toLowerCase();
        if (text === 'ordner') { ordnerIdx = idx; }
        if (text === 'veranstaltung') { veranstaltungIdx = idx; }
    });
    if (ordnerIdx === -1 && veranstaltungIdx === -1) { return; }

    var tbody = table.tBodies[0];
    var zeilen = Array.prototype.slice.call(tbody.rows);
    if (!zeilen.length) { return; }
    var spaltenAnzahl = zeilen[0].cells.length;

    var gruppen = [];
    var gruppenNachName = {};

    zeilen.forEach(function (row) {
        var zellen = row.cells;
        var ordnerText = ordnerIdx > -1 && zellen[ordnerIdx] ? zellen[ordnerIdx].textContent.trim() : '';
        var veranstaltungText = veranstaltungIdx > -1 && zellen[veranstaltungIdx] ? zellen[veranstaltungIdx].textContent.trim() : '';
        var name;
        if (ordnerText && ordnerText !== '-') {
            name = '📁 ' + ordnerText;
        } else if (veranstaltungText && veranstaltungText !== '-') {
            name = '🎉 ' + veranstaltungText;
        } else {
            name = 'Ohne Zuordnung';
        }
        if (!gruppenNachName[name]) {
            gruppenNachName[name] = { name: name, zeilen: [] };
            gruppen.push(gruppenNachName[name]);
        }
        gruppenNachName[name].zeilen.push(row);
    });

    if (gruppen.length <= 1) { return; }

    gruppen.forEach(function (gruppe) {
        var headerRow = document.createElement('tr');
        headerRow.className = 'galerie-gruppe-header';
        var td = document.createElement('td');
        td.colSpan = spaltenAnzahl;
        td.innerHTML = '<span class="galerie-gruppe-pfeil">▶</span>' + gruppe.name + ' (' + gruppe.zeilen.length + ')';
        headerRow.appendChild(td);
        tbody.appendChild(headerRow);

        gruppe.zeilen.forEach(function (row) {
            row.style.display = 'none';
            tbody.appendChild(row);
        });

        headerRow.addEventListener('click', function () {
            var eingeklappt = headerRow.classList.toggle('aufgeklappt');
            gruppe.zeilen.forEach(function (row) {
                row.style.display = eingeklappt ? '' : 'none';
            });
        });
    });
});
</script>
{% endblock %}
