{% extends "mitglieder/base.html" %}
{% load static %}
{% block title %}Login – Garde Tanz{% endblock %}
{% block content %}
<div class="login-hero">
    <img class="login-hero-banner" src="{% static 'mitglieder/garde-banner.png' %}" alt="DJK Oberasbach Garde – Team. Leidenschaft. Gemeinsam.">
</div>
<div class="card login-card">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-zusagen">Anmelden</button>
    </form>
    <p>
        <a href="{% url 'password_reset' %}">Passwort vergessen?</a>
        ·
        <a href="{% url 'benutzername_vergessen' %}">Benutzername vergessen?</a>
    </p>
    <p><a href="{% url 'registrieren' %}">Noch kein Konto? Hier registrieren</a></p>
</div>
{% endblock %}
